name: sync

# Started every 10 minutes by a Cloudflare Worker cron trigger (see cron/),
# which calls the workflow_dispatch API. GitHub's own schedule is best-effort
# (observed firing a few times a day) and is kept only as a backup.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download latest release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern calendar-sync-linux-amd64 --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/calendar-sync-linux-amd64"
      - name: Sync
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          HUB_CALENDAR_ID: ${{ secrets.HUB_CALENDAR_ID }}
          CALENDAR_ID_MASSAGE: ${{ secrets.CALENDAR_ID_MASSAGE }}
          CALENDAR_ID_WILL: ${{ secrets.CALENDAR_ID_WILL }}
          CALENDAR_ID_LEGAL: ${{ secrets.CALENDAR_ID_LEGAL }}
          CALENDAR_ID_WORK: ${{ secrets.CALENDAR_ID_WORK }}
        run: '"$RUNNER_TEMP/calendar-sync-linux-amd64" sync --config config.yaml --state state.json'
      # Runs even when Sync failed, so sources that did succeed keep their new tokens.
      - name: Commit state
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "sync: update state"
          git pull --rebase
          git push
